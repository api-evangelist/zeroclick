image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/zeroclick.png
name: Zeroclick
description: >-
  ZeroClick is the agent-first storefront and transaction layer that lets
  businesses sell directly to AI agents. It turns any existing API or offering
  into an agent-purchasable service, publishing a machine-readable storefront so
  agents can discover it and adding agent identity, agent-native payment rails
  (x402 and MPP, the Machine Payments Protocol), signed proxying, and
  per-transaction analytics in front of the seller's unchanged upstream API.
  Sellers keep their product, pricing, and customer experience, add a small
  guard to billed endpoints via the @zeroclickai/sellers SDK, and settle revenue
  to their own connected Stripe account. ZeroClick launched in July 2026, raised
  $55M, is backed by Forerunner Ventures, and is a product of the People's
  Internet Experiment.
