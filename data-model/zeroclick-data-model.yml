entities:
- name: Seller
  description: Your company or product in ZeroClick. Gets a hosted pay URL like https://<seller>.pay.zeroclick.io.
  attributes: [upstream_url, pay_url, custom_domains, signing_secret (zcsec_...), api_keys]
- name: Service
  description: One thing agents buy or use (an LLM model, a data API, a workflow, a platform feature). Usage is reported against a service.
  attributes: [serviceSlug]
  examples: [gpt-oss-120b, image-search, product-watch]
- name: Meter
  description: A billable measurement inside a service.
  attributes: [meterSlug, max_usage_per_request_default]
  examples: [requests, output_tokens, product_watch_hours, search_results]
- name: Plan
  description: How agents pay — pay-as-you-go, credit-based, subscription, or subscription with usage. Belongs to the seller.
  attributes: [planSlug, type]
- name: Price
  description: Price attached to a meter within a plan.
  attributes: [meterSlug, amount]
- name: SigningSecret
  description: Per-seller HMAC secret (zcsec_...) used to sign proxied requests; supports rotation via kid.
- name: ApiKey
  description: Scoped key for the ZeroClick API (admin:*/usage:* scopes).
- name: Agent
  description: The buying AI agent, identified by zc-agent-id (agt_...) once identity is proven.
